# =============================================================================
# OcularCheck AI — local development stack (Phase 1 · P1-T5)
# Local development only; production Dockerfiles and CD configs follow in
# Phase 16 (P16-T2).
#
# Run from infra/:   docker compose up --build
# Requires infra/.env — copy infra/.env.example first; every variable below is
# required (${VAR:?error}) so Compose fails loudly instead of starting with
# broken secrets. See README.md ("Local stack") for the full guide.
# =============================================================================

name: ocularcheck

networks:
  ocularcheck-dev:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  minio_data:
  backend_node_modules:

services:
  # ---------------------------------------------------------------------------
  # Postgres 17 + PostGIS 3.5 — the relational store (major.minor pinned tag).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ocularcheck-dev

  # ---------------------------------------------------------------------------
  # Redis — cache / pub-sub. Password is required; the container env var is re
  # declared here so the healthcheck never interpolates the secret into this file.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.2.10
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - ocularcheck-dev

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage.
  # NOTE: the official `minio/minio` image was deleted from Docker Hub and the
  # `quay.io/minio/minio` repo is private (401), so the nearest valid, verified
  # pull is Bitnami's build that was moved to the `bitnamilegacy` namespace
  # (frozen after Aug 2025). Uses the same MINIO_ROOT_* env contract upstream.
  # API on 9000, web console on 9001.
  # ---------------------------------------------------------------------------
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - ocularcheck-dev

  # ---------------------------------------------------------------------------
  # One-shot init: waits for MinIO, creates the PRIVATE bucket named
  # MINIO_BUCKET (New MinIO buckets deny anonymous access by default; the
  # explicit "anonymous set none" below enforces it), then exits 0.
  # Runs the mc binary directly — the Bitnami entrypoint wrapper is not needed.
  # ---------------------------------------------------------------------------
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    entrypoint: ["/bin/bash"]
    command:
      - -c
      - |
        set -euo pipefail
        until mc --config-dir /tmp/.mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "minio-init: MinIO not ready yet, retrying in 2s..."
          sleep 2
        done
        mc --config-dir /tmp/.mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc --config-dir /tmp/.mc anonymous set none "local/$${MINIO_BUCKET}"
        echo "minio-init: private bucket '$${MINIO_BUCKET}' is ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in infra/.env}
      MC_CONFIG_DIR: /tmp/.mc # mc needs a writable config dir (image runs as uid 1001, HOME=/)
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - ocularcheck-dev

  # ---------------------------------------------------------------------------
  # Backend (NestJS) — dev image, source bind-mounted for hot reload.
  # node_modules lives in a named volume populated from the image's npm ci, so
  # the Windows host node_modules is never used inside the container.
  # CHOKIDAR_USEPOLLING: Docker bind mounts on Windows don't always propagate
  # inotify file events (WSL2 FS-bridge); polling makes Nest CLI's watcher see
  # host edits at the cost of some CPU.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    command: npm run start:dev
    environment:
      PORT: ${BACKEND_PORT:?set BACKEND_PORT in infra/.env}
      CHOKIDAR_USEPOLLING: "true"
      # --- service-to-service config (hostnames are compose service names) ---
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/.env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in infra/.env}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in infra/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in infra/.env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
      AI_SERVICE_URL: ${AI_SERVICE_URL:?set AI_SERVICE_URL in infra/.env}
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${BACKEND_PORT:?set BACKEND_PORT in infra/.env}:${BACKEND_PORT:?set BACKEND_PORT in infra/.env}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${PORT}/health\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - ocularcheck-dev

  # ---------------------------------------------------------------------------
  # AI service (FastAPI) — dev image, source bind-mounted for hot reload.
  # WATCHFILES_FORCE_POLLING: uvicorn's --reload uses watchfiles, which has the
  # same Windows bind-mount event-loss problem as chokidar on the backend.
  # Container port stays 8000; AI_SERVICE_PORT only chooses the host port.
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile.dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../ai-service:/app
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:?set AI_SERVICE_PORT in infra/.env}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - ocularcheck-dev
