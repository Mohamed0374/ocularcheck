#.dependabot — keep dependencies fresh (Phase 1 · P1-T6).
# Weekly, max 5 open PRs per ecosystem, minor+patch grouped in one PR each,
# Conventional Commits prefix "chore(deps)".
version: 2

updates:
  # --- npm — backend ---------------------------------------------------------
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # --- pip — ai-service --------------------------------------------------------
  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
