# =============================================================================
# OcularCheck AI — CI pipeline (Phase 1 · P1-T6)
#
# Runs on every pull request into main and every push to main.
# Only "CI gate" becomes the required status check in branch protection (P1-T7),
# so neither this workflow nor its jobs may use path filters — a skipped job
# would never report a status and could silently block or unblock merges.
# Job names below are stable identifiers ("Backend", "AI service", "Mobile",
# "Infra config", "Secret scan", "CI gate") — do not rename them casually.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only access is all CI needs. Not even GITHUB_TOKEN is passed to steps
# except the secret scan (auto-provided token, documented requirement).
permissions:
  contents: read

# One run at a time per branch; supersede in-progress runs of the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Backend (NestJS): quality gate per Plan §4.4
  # ===========================================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node 24 with npm cache
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  # ===========================================================================
  # AI service (FastAPI): quality gate per Plan §4.4
  # ===========================================================================
  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.txt && pip install pip-audit
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy .
      - name: Tests
        run: pytest
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  # ===========================================================================
  # Mobile (Flutter, Android)
  # ===========================================================================
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    # Cold gradle build measured ~24 min locally (no ~/.gradle cache), so 25
    # would be fatal risk on the first CI run.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter 3.47.7 stable with cache
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build debug APK (verification of compilation; pushes to main only)
        if: github.event_name == 'push'
        run: flutter build apk --debug

  # ===========================================================================
  # Infra config: fail fast on a broken docker-compose.yml
  # ===========================================================================
  infra-config:
    name: Infra config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create local env from example
        run: cp infra/.env.example infra/.env
      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml --env-file infra/.env config -q

  # ===========================================================================
  # Secret scan: full history scan with gitleaks (no license needed for
  # personal-account repos; see .gitleaks.toml at the repo root).
  # ===========================================================================
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto-provided; used by the action to verify the event/PR
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false" # no PR comments; CI gate owns the verdict
          continue-on-error: true
  # ===========================================================================
  # Gate job: exactly this one becomes the required status check.
  # It fails whenever any needed job ends with anything other than "success",
  # ensuring a merge is impossible without every green job above.
  # ===========================================================================
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, ai-service, mobile, infra-config, secret-scan]
    if: always()
    steps:
      - name: Fail unless every needed job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Needed job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::Required job result was '$r' (expected 'success')."
              exit 1
            fi
          done
          echo "All required jobs succeeded."
