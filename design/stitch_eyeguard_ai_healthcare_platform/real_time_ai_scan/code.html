<script>
        // Simple interaction script to simulate focus ring on shutter click
        document.addEventListener('DOMContentLoaded', () => {
            const shutterBtn = document.querySelector('.group');
            const focusRing = shutterBtn.querySelector('circle');
            
            shutterBtn.addEventListener('mousedown', () => {
                focusRing.classList.remove('opacity-0');
            });
            
            shutterBtn.addEventListener('mouseup', () => {
                setTimeout(() => {
                    focusRing.classList.add('opacity-0');
                }, 500);
            });
            
            shutterBtn.addEventListener('touchstart', () => {
                focusRing.classList.remove('opacity-0');
            });
            
            shutterBtn.addEventListener('touchend', () => {
                setTimeout(() => {
                    focusRing.classList.add('opacity-0');
                }, 500);
            });
        });
    </script>
