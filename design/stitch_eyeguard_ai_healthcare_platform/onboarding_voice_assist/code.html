<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .voice-wave-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 60px;
        }

        .voice-bar {
            width: 6px;
            background-color: var(--color-primary, #0061a4);
            border-radius: 9999px;
            animation: pulse-wave 1.5s infinite ease-in-out;
        }

        .voice-bar:nth-child(1) { animation-delay: 0.1s; height: 30%; }
        .voice-bar:nth-child(2) { animation-delay: 0.3s; height: 60%; }
        .voice-bar:nth-child(3) { animation-delay: 0.5s; height: 100%; }
        .voice-bar:nth-child(4) { animation-delay: 0.7s; height: 70%; }
        .voice-bar:nth-child(5) { animation-delay: 0.9s; height: 40%; }

        @keyframes pulse-wave {
            0%, 100% { transform: scaleY(0.5); opacity: 0.7; }
            50% { transform: scaleY(1); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full bg-background text-on-surface antialiased overflow-hidden flex flex-col items-center justify-center relative">
<!-- Decorative Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-secondary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
<main class="relative z-10 w-full max-w-[400px] h-full max-h-[850px] flex flex-col justify-between px-6 py-8 md:rounded-[32px] md:shadow-2xl md:bg-surface-container-lowest md:h-[800px] md:my-auto">
<!-- Top Bar: Skip -->
<div class="flex justify-end w-full">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">
                Skip
            </button>
</div>
<!-- Illustration Canvas -->
<div class="flex-1 flex flex-col items-center justify-center relative w-full mt-8 mb-12">
<!-- Central Visual Container (Glassmorphism Card) -->
<div class="w-full aspect-square max-w-[280px] rounded-3xl glass-panel shadow-sm flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Image of patient with phone -->
<div class="w-40 h-40 rounded-full bg-primary-container/10 flex items-center justify-center mb-6 overflow-hidden border-4 border-surface-container-lowest relative">

</div>
<!-- Voice Wave Animation Overlay -->
<div class="absolute bottom-6 w-full flex justify-center">
<div class="bg-surface-container-lowest/90 px-6 py-3 rounded-full shadow-sm backdrop-blur-md border border-surface-variant">
<div class="voice-wave-container">
<div class="voice-bar"></div>
<div class="voice-bar"></div>
<div class="voice-bar"></div>
<div class="voice-bar"></div>
<div class="voice-bar"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Content Area -->
<div class="flex flex-col items-center text-center px-4 mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-md md:text-headline-md text-on-surface mb-4">
                Guided by Voice
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                Accessible and easy to use with real-time voice instructions.
            </p>
</div>
<!-- Bottom Navigation & Progress -->
<div class="w-full flex flex-col items-center gap-8 pb-safe">
<!-- Progress Dots -->
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div>

</div>

</button>
</div>
